# Bundle patch：向 profile 插件树注册 live-delivery 节点（ID 为 live-delivery，可在 Plugins 页面启停）。
#
# 配置覆盖说明：如需修改默认值，请在用户 profile 的 cordis.patch.yml 中按 id 覆盖 config：
#   autoContinue     默认 true，会话空闲且预算未尽时自动触发下一轮
#   maxAutoRounds    默认 6，单任务最大自动续轮次数
#   defaultBudget    默认 '30m'，ld_begin 未指定预算时使用
#   stateDir         默认 '.live-delivery'，状态与快照根目录名
#   snapshot         maxFiles 默认 1500，maxBytes 默认 64 MiB，entry 默认 'index.html'，
#                    ignore 规则追加在默认忽略列表之后
#
# 插件默认关闭，按会话通过 /deliver 命令控制启停。
- insert:
    - id: live-delivery
      name: '@0rch1d/dsh-live-delivery'
      config: {}
